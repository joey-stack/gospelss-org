<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#121417" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#D97706" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#18181B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="crossAura" cx="50%" cy="35%" r="30%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#stageGlow)" />

  <!-- Sacred Light Beams -->
  <polygon points="400,0 320,450 480,450" fill="#FFFFFF" opacity="0.04" />
  <polygon points="400,0 180,450 280,450" fill="#14B8A6" opacity="0.05" />
  <polygon points="400,0 520,450 620,450" fill="#14B8A6" opacity="0.05" />

  <!-- Subtle Resonance Cross Mark in Center -->
  <circle cx="400" cy="160" r="80" fill="url(#crossAura)" />
  <rect x="394" y="100" width="12" height="120" rx="6" fill="#14B8A6" opacity="0.85" />
  <rect x="340" y="135" width="120" height="12" rx="6" fill="#14B8A6" opacity="0.85" />

  <!-- Sound / Energy Waves -->
  <path d="M 150 280 Q 400 240 650 280" stroke="#5EEAD4" stroke-width="2" fill="none" opacity="0.3" />
  <path d="M 100 310 Q 400 270 700 310" stroke="#14B8A6" stroke-width="1.5" fill="none" opacity="0.2" />
  <path d="M 50 340 Q 400 300 750 340" stroke="#D97706" stroke-width="1" fill="none" opacity="0.15" />

  <!-- Crowd & Worship Silhouette -->
  <path d="M 0 450 L 0 380 Q 50 365 100 385 Q 160 360 220 380 Q 280 355 340 375 Q 400 350 460 375 Q 520 355 580 380 Q 640 360 700 385 Q 750 365 800 380 L 800 450 Z" fill="#090A0C" />
  
  <!-- Raised Hands Silhouettes -->
  <path d="M 385 365 L 390 320 Q 395 315 400 320 L 405 365 Z" fill="#090A0C" />
  <path d="M 425 370 L 435 325 Q 440 320 445 328 L 445 370 Z" fill="#090A0C" />
  <path d="M 235 375 L 240 335 Q 245 330 250 338 L 252 375 Z" fill="#090A0C" />
  <path d="M 565 375 L 560 330 Q 555 325 550 332 L 548 375 Z" fill="#090A0C" />

  <!-- Typography Overlay -->
  <text x="40" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#5EEAD4" text-transform="uppercase">GOSPELS LIVE · GÖTEBORG</text>
  <text x="40" y="105" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">Holy Spirit Worship 2026</text>
  <text x="40" y="135" font-family="system-ui, sans-serif" font-size="15" fill="#94A3B8">14 November · Trädgårdsföreningen · Fri Entré</text>
